<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2E7D32">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <svg viewBox="0 0 24 24">
                <path d="M17,8C8,10,5.9,16.17,3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20.83c2.44,0,5.3-1.36,7.39-3.32C17.75,15.31,19,12.18,19,8.5A8.35,8.35,0,0,0,18.86,7,8.26,8.26,0,0,0,17,8ZM8,19a2.9,2.9,0,0,1-1.16-.24c.44-1.06,1.4-3.38,3.16-4.76,1.4-1.1,3.2-1.7,5-2.16A8.09,8.09,0,0,1,13.5,15.5C11.6,17.1,9.5,19,8,19Z"/>
            </svg>
            <h1>Registro de Trabajos</h1>
            <p>Ingresá tus credenciales</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="usuario" placeholder=" " required autocomplete="username">
                <label for="usuario">Usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                <label for="password">Contraseña</label>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText">Ingresar</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
